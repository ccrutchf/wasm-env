[package]
name = "wasm-env"
version = "0.1.0"
description = "Runs wasm-env programs: WebAssembly modules that use the Linux syscall ABI in docs/abi.md"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
getrandom = "0.3"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
# `wasm-env convert`: pulling OCI images.
ureq = "3"
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
wasmtime = "49"
