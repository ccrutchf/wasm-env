[package]
name = "wasm-env"
version = "0.1.0"
description = "Runs wasm-env programs: WebAssembly modules that use the Linux syscall ABI in docs/abi.md"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
getrandom = "0.3"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
# `wasm-env convert`: pulling OCI images.
ureq = "3"
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
wasmtime = "49"
# The runtime's Wayland compositor (wayland/): the protocol descriptions, and
# host windows (winit) drawn in software (softbuffer), on every host.
quick-xml = "0.38"
winit = "0.30"
softbuffer = "0.4"
# Code a program generates at run time is translated in-process (see
# translate::ensure_code).
wasm-env-translate = { path = "../translator", features = ["lift"] }
