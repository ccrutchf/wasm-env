[workspace]
resolver = "3"
members = ["bench/harness", "gpu", "runtime", "translator"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
debug = "line-tables-only"

# M-1 experiment: masked bounds checks for 64-bit memories.
# See vendor/wasmtime-internal-cranelift/src/bounds_checks.rs (search "wasm-env").
[patch.crates-io]
wasmtime-internal-cranelift = { path = "vendor/wasmtime-internal-cranelift" }
# No callee-saved registers in the tail calling convention: see
# vendor/cranelift-codegen/src/isa/x64/abi.rs (search "wasm-env").
cranelift-codegen = { path = "vendor/cranelift-codegen" }
# bad64 (the arm64 decoder) passes its C enums as i32, which Windows
# targets' bindings make u32: `as _` at the four calls (vendor/bad64).
bad64 = { path = "vendor/bad64" }
# naga (wgpu's shader translator) took a fetch from an element of a binding
# array (Vulkan's descriptor arrays) for one from the array:
# vendor/naga/src/front/spv/image.rs; and panicked at atomics through
# anything but an array or a struct: vendor/naga/src/front/spv/mod.rs
# (search "wasm-env").
naga = { path = "vendor/naga" }
