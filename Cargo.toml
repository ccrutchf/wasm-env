[workspace]
resolver = "3"
members = ["bench/harness", "runtime", "translator"]
# The translator is excluded from plain `cargo build` until its instruction
# semantics (translator/src/lift/insn.rs) are complete; build it with -p.
default-members = ["bench/harness", "runtime"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
debug = "line-tables-only"

# M-1 experiment: masked bounds checks for 64-bit memories.
# See vendor/wasmtime-internal-cranelift/src/bounds_checks.rs (search "wasm-env").
[patch.crates-io]
wasmtime-internal-cranelift = { path = "vendor/wasmtime-internal-cranelift" }
