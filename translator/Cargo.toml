[package]
name = "wasm-env-translate"
version = "0.1.0"
description = "Translates arm64 Linux ELF binaries to wasm-env WebAssembly programs"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
bad64 = "0.12"
object = { version = "0.37", default-features = false, features = ["read", "elf", "std"] }
wasm-encoder = { version = "0.259", optional = true }

[dev-dependencies]
wasmtime = "49"

[features]
# The arm64 → LLVM IR lifter. Off until its instruction semantics
# (src/lift/insn.rs) are complete, so the rest of the crate builds and tests.
lift = ["dep:wasm-encoder"]
