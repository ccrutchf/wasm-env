[package]
name = "wasm-env-gpu"
version = "0.1.0"
description = "wasm-env's GPU service: OpenCL kernels compiled to WGSL and run on wgpu"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wgpu = { version = "30", features = ["naga-ir"] }
pollster = "0.4"
# (wgpu's own warnings, shown under WASM_ENV_DEBUG_GPU.)
log = "0.4"
# (SPIR-V shaders, for Vulkan: read, and given to wgpu as naga's IR.)
naga = { version = "30", features = ["spv-in", "wgsl-out"] }

[dev-dependencies]
# (Correctly rounded references: MinGW's fma isn't.)
libm = "0.2"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
